name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (fail only on real errors: syntax/undefined names)
        run: flake8 src app run.py scripts

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Integration tests (network/blockchain/models mocked)
        run: python -m pytest tests/integration -q -m "not live"
